            console.log('Intensity:', selectedIntensity);

        function gravaNoHistorico(status){
  
            gravaHistoricoAgendamentos(status);
  

  
  

        }
        function gravaHistoricoAgendamentos(novoAgendamento){
            agendamentos = localStorage.getItem("agendamentos");

            if (!agendamentos) {
                agendamentos = [];
            } else {
                agendamentos = JSON.parse(agendamentos);
            }

            agendamentos.push(novoAgendamento);

            // Salva a lista atualizada no localStorage
            localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
        }

        // Adicionando um ouvinte de eventos para rastrear as alterações na barra de intensidade
        document.getElementById('intensitySlider').addEventListener('input', function() {
            selectedIntensity = parseInt(this.value, 10);
            applyStoredSettings();
        });
