<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>SmartHome</title>
</head>
<body>
    
    <div class="grid-divisoes">
        
        <div class="header">
          
            <div>
                <a href="divisoes.html">
                    <img id="logo-casa" src="images/casa2-removebg-preview.png" alt="Logo casa">
                </a>
            </div>
    
            <div id="Smarthome">
                <a href="divisoes.html">
                    <h1>SmartHome</h1>
                </a>
            </div>
          
            <div id="horas">horas</div>
        </div>


        <h1 id="titulo-ac">Agendamentos</h1>
   
        
        <div id="containerr">
    
            <h1 id="jj">Controlador de Estores</h1>
    

            <div class="contaiiner">
                <div class="box-orange">(ABERTO) 100</div>
                <div class="box-blue"> 0 (FECHADO)</div>
            </div>
            
            <input type="range" id="intensitySlider" min="0" max="100" step="1">
            
            <button id="btn_aplicar" onclick="document.getElementById('areyousure').style.display='block'" enab>Aplicar</button>
        </div>

        <div id="areyousure" class="modal">
            <h3>Tem a certeza que pretende aplicar as alterações?</h3>
            <button type="button" id="btnsim" onclick="applySettings()">SIM</button>
            <button id="btnnao" onclick="document.getElementById('areyousure').style.display='none'" >NÃO</button>
        
        </div>
    
        <div class="divisao" id="div10">
            <a href="agendamentos.html"><div class="voltar">Voltar</div></a>
        </div>


        <script>
            
            let selectedIntensity = 30;
           
            const localStorageKey = 'agendamentos-estores'; // Nome do array
            
    
            // Verificar se existem valores no localStorage ao carregar a página
            window.onload = function() {

                atualizahoras()
                
                const storedSettings = JSON.parse(localStorage.getItem(localStorageKey));

                if (storedSettings && storedSettings.length === 1) {
                    selectedIntensity = storedSettings[0];
            
                    applyStoredSettings();
                }
            };
    
            function atualizahoras(){
                let data = new Date();
                var tempo = document.getElementById("horas");
                let horas = data.getHours();
                let minutos = data.getMinutes();
                if(minutos<10){
                    minutos = "0" + minutos;
                }
            
                tempo.innerHTML = horas +":"+minutos;
                setTimeout("atualizahoras()",1000)
            }
    
            function applyStoredSettings() {
               
                const intensitySlider = document.getElementById('intensitySlider');
            
                intensitySlider.value = selectedIntensity;
            
                const applyButton = document.getElementById('applyButton');
    
            }
    
            function applySettings() {
                          
                const settingsArray = [selectedIntensity];
                const DetalhesAgendamento = localStorage.getItem("detalhes-agendamento")
                
                statusagendamento=[DetalhesAgendamento];
                gravaNoHistorico(statusagendamento);
                //localStorage.setItem(localStorageKey, JSON.stringify(settingsArray));

                window.location.href = "agendamentos.html";
            }
            function gravaNoHistorico(status){
  
                gravaHistoricoAgendamentos(status);

            }
            function gravaHistoricoAgendamentos(novoAgendamento){
                agendamentos = localStorage.getItem("agendamentos");

                if (!agendamentos) {
                    agendamentos = [];
                } else {
                    agendamentos = JSON.parse(agendamentos);
                }

                agendamentos.push(novoAgendamento);

                // Salva a lista atualizada no localStorage
                localStorage.setItem("agendamentos", JSON.stringify(agendamentos));
            }
                
            // Adicionando um ouvinte de eventos para rastrear as alterações na barra de intensidade
            document.getElementById('intensitySlider').addEventListener('input', function() {
                selectedIntensity = parseInt(this.value, 10);
                applyStoredSettings();
            });
        </script>
</body>
</html>
